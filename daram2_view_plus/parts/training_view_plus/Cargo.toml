[package]
name = "training_view_plus"
version = "0.6.0"
edition = "2021"

# daram2 training_view_plus(0.5.2, 클래식 SDK · Database::training_plans 직접 쓰기)의 0.6.0 stable 껍데기 재작성(2026-09-18).
# 클라 = 훈련 화면 버튼 + 패널(포지션 5 × 역할군 풀다운 · 매일 자동) · 서버 = ui_kit\training_plan_stable.rs(0.6.0 RE 경로 B).

[lib]
# rlib = integrated mod daram2_view_plus links this crate by path (2026-11-11). Standalone output is unchanged: target\release\<name>.dll.
crate-type = ["cdylib", "rlib"]

# embedded = integrated build only: turns off the entry export (declare_stable_mod!) and opens `embedded::init`;
# files go to the integrated mod folder. Off by default -> standalone build is unaffected.
[features]
embedded = []

[dependencies]
mod-api-stable = { path = "../../../mod-api-stable" }
serde_json = "1"


[profile.release]
opt-level = 1
overflow-checks = false
